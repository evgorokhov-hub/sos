<style>body{margin:0;font-family:system-ui,sans-serif;background:#fff;color:#111;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}main{width:100%;max-width:480px;padding:24px}h1{font-size:1.4em}textarea{width:100%;box-sizing:border-box;font-size:1.1em;padding:12px;border:2px solid #ccc;border-radius:10px;min-height:110px}#sos{width:220px;height:220px;border-radius:50%;border:0;background:#d00;color:#fff;font-size:3.2em;font-weight:800;margin:24px auto;display:block;box-shadow:0 6px 20px rgba(200,0,0,.4)}#sos:disabled{opacity:.6}.hp{position:absolute;left:-9999px}#ok{display:none}#ok h1{color:#080;font-size:1.8em}.fb{font-size:.95em;color:#555}a{color:#d00}#arch{display:none;text-align:left;margin-top:20px;border:2px solid #ccc;border-radius:10px;padding:16px}#arch .big{display:block;text-align:center;background:#d00;color:#fff;text-decoration:none;font-size:1.3em;font-weight:700;padding:16px;border-radius:10px;margin-bottom:12px}#arch ol{padding-left:20px;margin:0}#arch li{margin:6px 0}#arch form .big{margin-bottom:0}</style></head><body><main>

<div id="arch"><form id="lk"><p><b>Введите пароль, чтобы открыть архив</b></p><input id="pw" type="password" autocomplete="off" style="width:100%;box-sizing:border-box;font-size:1.1em;padding:12px;border:2px solid #ccc;border-radius:10px"><button type="submit" class="big" style="width:100%;border:0;margin-top:12px;cursor:pointer">Открыть</button><p id="pe" style="color:#d00"></p></form><div id="ac"></div></div>

if(j.success===true||j.success==="true"){document.getElementById('form').style.display='none';document.getElementById('ok').style.display='block';showArch('ok');}else throw 0;}
catch(x){b.disabled=false;document.getElementById('err').innerHTML='Не удалось отправить. <a href="mailto:gorokhov@mail.grokbot.com?subject=SOS">Отправьте письмо</a>.';showArch('form');}};
